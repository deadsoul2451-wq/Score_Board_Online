
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score Board</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand">Score Board</a>
            <a href="choice.html" class="btn btn-outline-light">Kembali</a>
        </div>
    </nav>

    <div class="container mt-4 mb-5">

        <h1 class="text-center mb-4">Score Board</h1>

        <!-- Pengaturan Poin -->
        <div class="card shadow-sm p-3 mb-4">

            <div class="row g-3">

                <!-- Tambah -->
                <div class="col-md-6">
                    <label class="form-label fw-bold text-success">
                        Tambah Poin (+)
                    </label>

                    <select id="addPoint" class="form-select">
                        <option value="1">+1</option>
                        <option value="2">+2</option>
                        <option value="5">+5</option>
                        <option value="10">+10</option>
                        <option value="20">+20</option>
                        <option value="25">+25</option>
                        <option value="50">+50</option>
                        <option value="100">+100</option>
                    </select>
                </div>

                <!-- Kurang -->
                <div class="col-md-6">
                    <label class="form-label fw-bold text-danger">
                        Kurangi Poin (-)
                    </label>

                    <select id="minusPoint" class="form-select">
                        <option value="1">-1</option>
                        <option value="2">-2</option>
                        <option value="5">-5</option>
                        <option value="10">-10</option>
                        <option value="20">-20</option>
                        <option value="25">-25</option>
                        <option value="50">-50</option>
                        <option value="100">-100</option>
                    </select>
                </div>

            </div>
        </div>

        <!-- Tempat Pemain -->
        <div class="row g-3" id="scoreContainer"></div>

        <!-- Reset -->
        <div class="text-center mt-4">
            <button class="btn btn-danger btn-lg" onclick="resetScore()">
                Reset Score
            </button>
        </div>

    </div>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0">by Fians</p>
    </footer>

    <script>

        // Mengambil pengaturan dari choice.html
        const settings = JSON.parse(
            localStorage.getItem("scoreSettings")
        );

        // Jika belum memilih pengaturan
        if (!settings) {
            alert("Pengaturan score belum tersedia!");
            window.location.href = "choice.html";
        }

        // Mengambil peserta
        let players = settings ? settings.participants : [];

        // Membuat skor awal
        let scores = players.map(() => 0);

        const container = document.getElementById("scoreContainer");

        // Mengatur kelipatan awal
        document.getElementById("addPoint").value =
            settings ? settings.addPoint : "1";

        document.getElementById("minusPoint").value =
            settings ? settings.minusPoint : "1";

        // Membuat kartu pemain
        players.forEach((player, index) => {

            container.innerHTML += `
                <div class="col-md-6 col-lg-4">
                    <div class="card shadow p-4 text-center h-100">

                        <h3>${player}</h3>

                        <h1 id="score${index}" class="my-4">
                            0
                        </h1>

                        <div class="d-flex justify-content-center gap-2">

                            <button type="button"
                                class="btn btn-danger btn-lg flex-fill"
                                onclick="changeScore(${index}, 'minus')">
                                −
                            </button>

                            <button type="button"
                                class="btn btn-success btn-lg flex-fill"
                                onclick="changeScore(${index}, 'add')">
                                +
                            </button>

                        </div>

                    </div>
                </div>
            `;
        });

        // Fungsi tambah dan kurang
        function changeScore(index, direction) {

            let point;

            if (direction === "add") {
                point = parseInt(
                    document.getElementById("addPoint").value
                );
            } 
            else {
                point = parseInt(
                    document.getElementById("minusPoint").value
                );
            }

            if (direction === "add") {
                scores[index] += point;
            } 
            else {
                scores[index] -= point;
            }

            document.getElementById("score" + index).innerText =
                scores[index];
        }

        // Reset skor
        function resetScore() {

            if (confirm("Apakah kamu yakin ingin mereset semua score?")) {

                scores = players.map(() => 0);

                players.forEach((player, index) => {
                    document.getElementById("score" + index).innerText = 0;
                });

            }
        }

    </script>

    <script src="js/bootstrap.bundle.min.js"></script>

</body>
</html>
